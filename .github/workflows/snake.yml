name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  
  workflow_dispatch:
  
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Cbbrxdd
        
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif?color=blue&color_dark=#282a36

      - uses: EndBug/add-and-commit@v9
        with:
          message: 'Generate contribution snake'
          add: 'dist'
          push: true
